<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',ui-sans-serif,system-ui,-apple-system,sans-serif" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#1b1340"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.42">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#818cf8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#ffffff" fill-opacity="0.04"/>
    </pattern>
    <marker id="ah" viewBox="0 0 12 12" refX="5" refY="6" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L12,6 L0,12 L3.5,6 Z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#dots)"/>
  <circle cx="400" cy="196" r="190" fill="url(#glow)"/>

  <!-- structural faint ring -->
  <circle cx="400" cy="196" r="90" fill="none" stroke="#818cf8" stroke-opacity="0.14" stroke-width="1"/>
  <!-- bright directional arc: gap at top, arrowhead at end -->
  <path d="M 445 118 A 90 90 0 1 1 355 118" fill="none" stroke="url(#loop)" stroke-width="7" stroke-linecap="round" marker-end="url(#ah)" opacity="0.95"/>

  <!-- center agent chip driven by the loop -->
  <rect x="350" y="178" width="100" height="36" rx="18" fill="#0f1a2e" stroke="#2dd4bf" stroke-width="1.3"/>
  <circle cx="370" cy="196" r="3.5" fill="#5eead4"/>
  <text x="382" y="196" dominant-baseline="middle" font-size="14" fill="#ccfbf1" font-weight="600" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">agent</text>
  <text x="400" y="232" text-anchor="middle" dominant-baseline="middle" font-size="11.5" fill="#5eead4" letter-spacing="1">RECURSIVE · GOAL</text>

  <!-- ===== 5 building-block nodes sitting on the ring ===== -->
  <!-- ① top: Automations -->
  <line x1="400" y1="146" x2="400" y2="124" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="400" cy="106" r="13" fill="#0b1220" stroke="url(#loop)" stroke-width="2"/>
  <text x="400" y="106" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#a5b4fc">1</text>
  <text x="400" y="82" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#cbd5e1" font-weight="600">自动化</text>

  <!-- ② upper-right: Worktrees -->
  <line x1="466" y1="150" x2="478" y2="138" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="486" cy="168" r="13" fill="#0b1220" stroke="url(#loop)" stroke-width="2"/>
  <text x="486" y="168" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#a5b4fc">2</text>
  <text x="510" y="168" dominant-baseline="middle" font-size="13.5" fill="#cbd5e1" font-weight="600">工作树</text>

  <!-- ③ lower-right: Sub-agents -->
  <line x1="455" y1="282" x2="463" y2="296" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="453" cy="269" r="13" fill="#0b1220" stroke="url(#loop)" stroke-width="2"/>
  <text x="453" y="269" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#a5b4fc">3</text>
  <text x="475" y="305" dominant-baseline="middle" font-size="13.5" fill="#cbd5e1" font-weight="600">子 agent</text>

  <!-- ④ lower-left: Connectors -->
  <line x1="345" y1="282" x2="337" y2="296" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="347" cy="269" r="13" fill="#0b1220" stroke="url(#loop)" stroke-width="2"/>
  <text x="347" y="269" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#a5b4fc">4</text>
  <text x="325" y="305" text-anchor="end" dominant-baseline="middle" font-size="13.5" fill="#cbd5e1" font-weight="600">连接器</text>

  <!-- ⑤ upper-left: Skills -->
  <line x1="334" y1="150" x2="322" y2="138" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5"/>
  <circle cx="314" cy="168" r="13" fill="#0b1220" stroke="url(#loop)" stroke-width="2"/>
  <text x="314" y="168" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#a5b4fc">5</text>
  <text x="290" y="168" text-anchor="end" dominant-baseline="middle" font-size="13.5" fill="#cbd5e1" font-weight="600">技能</text>

  <!-- ===== memory: the spine ===== -->
  <rect x="250" y="338" width="300" height="30" rx="15" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-opacity="0.45"/>
  <!-- tiny DB/file cylinder icon -->
  <ellipse cx="276" cy="353" rx="9" ry="3.4" fill="none" stroke="#a5b4fc" stroke-width="1.2"/>
  <path d="M 267 353 V 348 A 9 3.4 0 0 0 285 348 V 353" fill="none" stroke="#a5b4fc" stroke-width="1.2"/>
  <text x="294" y="353" dominant-baseline="middle" font-size="12.5" fill="#c7d2fe">记忆 · memory · 整套系统的脊柱</text>

  <!-- top-left badge -->
  <rect x="32" y="34" width="116" height="30" rx="15" fill="#2dd4bf" fill-opacity="0.12" stroke="#2dd4bf" stroke-opacity="0.55"/>
  <text x="90" y="49" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#5eead4" letter-spacing="0.5">5 BLOCKS</text>

  <!-- top-right tagline -->
  <text x="768" y="49" text-anchor="end" dominant-baseline="middle" font-size="13" fill="#64748b" font-style="italic">design loops, not prompts</text>

  <!-- title -->
  <text x="400" y="395" text-anchor="middle" dominant-baseline="middle" font-size="38" font-weight="800" fill="#f8fafc" letter-spacing="0.5">Loop Engineering</text>
  <text x="400" y="422" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#94a3b8">别再亲自给 agent 写提示词，去设计那个替你写的系统</text>
</svg>
