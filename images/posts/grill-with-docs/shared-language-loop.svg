<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="title desc" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',ui-sans-serif,system-ui,-apple-system,sans-serif">
  <title id="title">从模糊需求到共同语言的工作循环</title>
  <desc id="desc">新需求先对照 context.md，发现歧义后通过具体场景确认，再把术语与规则写回文档，最后开始实现。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="898" height="518" rx="20" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="62" font-size="22" font-weight="700" fill="#0f172a">共同语言不是一次性文档，而是一轮可重复的确认</text>
  <text x="56" y="91" font-size="14" fill="#64748b">先核对已有定义，再把确认过的含义留给下一次对话和实现。</text>

  <path d="M178 257 H220" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M348 257 H390" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M518 257 H560" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M688 257 H730" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M816 338 C816 430 84 430 84 338" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="8 8" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="188" width="128" height="138" rx="16" fill="#fff" stroke="#cbd5e1"/>
    <circle cx="84" cy="220" r="16" fill="#dbeafe"/>
    <path d="M77 220h14M84 213v14" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
    <text x="114" y="225" font-size="16" font-weight="700" fill="#1e3a8a">新需求</text>
    <text x="66" y="267" font-size="14" fill="#334155">描述目标、</text>
    <text x="66" y="291" font-size="14" fill="#334155">规则和例外</text>
  </g>

  <g>
    <rect x="220" y="188" width="128" height="138" rx="16" fill="#fff" stroke="#a7f3d0"/>
    <path d="M253 210h34v42h-34z" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <path d="M261 223h18M261 235h13M261 247h18" stroke="#047857" stroke-width="2" stroke-linecap="round"/>
    <text x="284" y="225" font-size="16" font-weight="700" fill="#065f46">读取</text>
    <text x="284" y="249" font-size="16" font-weight="700" fill="#065f46">context.md</text>
    <text x="236" y="291" font-size="14" fill="#334155">已有术语与关系</text>
  </g>

  <g>
    <rect x="390" y="188" width="128" height="138" rx="16" fill="#fff" stroke="#fde68a"/>
    <circle cx="422" cy="222" r="18" fill="#fef3c7"/>
    <path d="M416 216c0-4 3-7 7-7s7 3 7 7c0 6-7 6-7 12M423 240h.01" fill="none" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/>
    <text x="454" y="225" font-size="16" font-weight="700" fill="#92400e">发现歧义</text>
    <text x="406" y="267" font-size="14" fill="#334155">名称冲突、</text>
    <text x="406" y="291" font-size="14" fill="#334155">关系不明确</text>
  </g>

  <g>
    <rect x="560" y="188" width="128" height="138" rx="16" fill="#fff" stroke="#c4b5fd"/>
    <path d="M590 210h30a8 8 0 0 1 8 8v20a8 8 0 0 1-8 8h-13l-9 9v-9h-8a8 8 0 0 1-8-8v-20a8 8 0 0 1 8-8z" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="634" y="225" font-size="16" font-weight="700" fill="#5b21b6">具体场景</text>
    <text x="576" y="267" font-size="14" fill="#334155">追问边界、</text>
    <text x="576" y="291" font-size="14" fill="#334155">确认规则</text>
  </g>

  <g>
    <rect x="730" y="188" width="128" height="138" rx="16" fill="#fff" stroke="#93c5fd"/>
    <path d="M758 208h32l12 12v38h-44z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M790 208v12h12M768 231h24M768 243h18" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
    <text x="784" y="280" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">更新文档</text>
    <text x="784" y="304" text-anchor="middle" font-size="14" fill="#334155">再进入实现</text>
  </g>

  <rect x="184" y="435" width="532" height="44" rx="12" fill="#ecfeff" stroke="#99f6e4"/>
  <circle cx="214" cy="457" r="8" fill="#0f766e"/>
  <text x="235" y="462" font-size="15" fill="#115e59">下一次对话、代码修改和新人接手，都从已确认的定义开始。</text>
</svg>
