<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',ui-sans-serif,system-ui,-apple-system,sans-serif" text-rendering="geometricPrecision">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#94a3b8"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#65a30d"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- outer card -->
  <rect x="0.5" y="0.5" width="799" height="559" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- ===== source of truth ===== -->
  <rect x="220" y="34" width="360" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="56" text-anchor="middle" dominant-baseline="middle" font-size="13.5" fill="#334155">sprint-status.yaml · 唯一真相来源（BMAD skills 拥有）</text>
  <line x1="400" y1="78" x2="400" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- ===== orchestrator band ===== -->
  <rect x="32" y="104" width="736" height="160" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <circle cx="60" cy="130" r="6" fill="#2563eb"/>
  <text x="74" y="130" dominant-baseline="middle" font-size="15" font-weight="700" fill="#1e3a8a">bmad-loop 编排器（Python · 确定性）</text>
  <text x="768" y="130" text-anchor="end" dominant-baseline="middle" font-size="12" fill="#1d4ed8">控制流走代码，不走提示词</text>

  <!-- step chips: w=124 h=66, start x=50, step 144 -->
  <!-- ① pick (python/blue) -->
  <rect x="50" y="158" width="124" height="66" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="112" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">① pick story</text>
  <text x="112" y="206" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Python</text>
  <!-- arrow -->
  <line x1="174" y1="191" x2="194" y2="191" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- ② implement (LLM/violet) -->
  <rect x="194" y="158" width="124" height="66" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="256" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">② implement</text>
  <text x="256" y="206" text-anchor="middle" font-size="11.5" fill="#7c3aed">LLM · dev 会话</text>
  <line x1="318" y1="191" x2="338" y2="191" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- ③ review (LLM/violet) -->
  <rect x="338" y="158" width="124" height="66" rx="10" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="400" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">③ review</text>
  <text x="400" y="206" text-anchor="middle" font-size="11.5" fill="#7c3aed">LLM · 独立会话</text>
  <line x1="462" y1="191" x2="482" y2="191" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- ④ verify (python/blue) -->
  <rect x="482" y="158" width="124" height="66" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="544" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">④ verify</text>
  <text x="544" y="206" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Python · 磁盘校验</text>
  <line x1="606" y1="191" x2="626" y2="191" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>

  <!-- ⑤ commit (python/blue) -->
  <rect x="626" y="158" width="124" height="66" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="688" y="184" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">⑤ commit</text>
  <text x="688" y="206" text-anchor="middle" font-size="11.5" fill="#1d4ed8">测试 + lint 全过</text>

  <!-- band footer note -->
  <text x="400" y="250" text-anchor="middle" font-size="12" fill="#475569">只有 ② ③ 是 LLM 在一次性会话里干活，其余都是确定性代码</text>

  <!-- ===== fork: pass / fail ===== -->
  <line x1="400" y1="264" x2="400" y2="288" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="288" x2="620" y2="288" stroke="#94a3b8" stroke-width="2"/>
  <line x1="180" y1="288" x2="180" y2="312" stroke="#65a30d" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="620" y1="288" x2="620" y2="312" stroke="#d97706" stroke-width="2" marker-end="url(#ay)"/>
  <text x="180" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#65a30d">Pass</text>
  <text x="620" y="304" text-anchor="middle" font-size="11.5" font-weight="700" fill="#d97706">Fail / CRITICAL</text>

  <!-- ===== pass: next story (left) ===== -->
  <rect x="64" y="316" width="232" height="44" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="180" y="338" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#166534">✓ 下一个 story</text>

  <!-- ===== fail: deferred-work ledger (right) ===== -->
  <rect x="440" y="316" width="296" height="58" rx="10" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="448" y="340" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#92400e">deferred-work.md 台账</text>
  <text x="448" y="360" dominant-baseline="middle" font-size="12" fill="#b45309">写进去的债，等人或后续 story 来还</text>

  <!-- arrow to sweep -->
  <line x1="588" y1="374" x2="588" y2="398" stroke="#d97706" stroke-width="2" marker-end="url(#ay)"/>

  <!-- sweep chip -->
  <rect x="440" y="400" width="296" height="44" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="588" y="422" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#92400e">bmad-loop sweep · 只读巡检 + 分区</text>

  <!-- fan-out to three outcomes -->
  <line x1="588" y1="444" x2="588" y2="462" stroke="#d97706" stroke-width="2"/>
  <line x1="168" y1="462" x2="632" y2="462" stroke="#d97706" stroke-width="2"/>
  <line x1="168" y1="462" x2="168" y2="478" stroke="#d97706" stroke-width="2" marker-end="url(#ay)"/>
  <line x1="400" y1="462" x2="400" y2="478" stroke="#d97706" stroke-width="2" marker-end="url(#ay)"/>
  <line x1="632" y1="462" x2="632" y2="478" stroke="#d97706" stroke-width="2" marker-end="url(#ay)"/>

  <!-- three outcomes -->
  <rect x="63" y="482" width="210" height="48" rx="10" fill="#dcfce7" stroke="#86efac"/>
  <text x="168" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">自动关闭</text>
  <text x="168" y="520" text-anchor="middle" font-size="11" fill="#15803d">already_resolved · 带证据</text>

  <rect x="295" y="482" width="210" height="48" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="400" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">打包再干</text>
  <text x="400" y="520" text-anchor="middle" font-size="11" fill="#1d4ed8">bundles · 一个 dev 会话</text>

  <rect x="527" y="482" width="210" height="48" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="632" y="502" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">升级给人</text>
  <text x="632" y="520" text-anchor="middle" font-size="11" fill="#b91c1c">/bmad-loop-resolve</text>

  <!-- legend -->
  <g transform="translate(48,545)">
    <rect x="0" y="0" width="13" height="13" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="19" y="7" dominant-baseline="middle" font-size="11.5" fill="#475569">Python</text>
    <rect x="92" y="0" width="13" height="13" rx="3" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="111" y="7" dominant-baseline="middle" font-size="11.5" fill="#475569">LLM</text>
    <rect x="170" y="0" width="13" height="13" rx="3" fill="#dcfce7" stroke="#86efac"/>
    <text x="189" y="7" dominant-baseline="middle" font-size="11.5" fill="#475569">通过 / 已解决</text>
    <rect x="284" y="0" width="13" height="13" rx="3" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="303" y="7" dominant-baseline="middle" font-size="11.5" fill="#475569">延后 / 需人决策</text>
  </g>
</svg>
